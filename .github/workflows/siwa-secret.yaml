name: Sign in with Apple secret

# Apple's client secret (Supabase → Auth → Apple → "Secret Key (for OAuth)") is a
# JWT that lives at most 6 months; when it lapses, web and Android Apple sign-in
# fail with invalid_client. Monthly rotation leaves five missed runs of margin.
# The secrets belong to the team that owns the app: after an app transfer, swap
# them for the new team's key (docs/APP_TRANSFER.md).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Rotate the secret in Supabase
        run: |
          key="$RUNNER_TEMP/siwa.p8"
          printf '%s\n' "$APPLE_SIWA_KEY" > "$key"
          uv run --locked --project tools/app-transfer app-transfer siwa secret \
            --team "$APPLE_TEAM_ID" --key-id "$APPLE_SIWA_KEY_ID" --key "$key" \
            --client-id "$APPLE_SERVICES_ID" --supabase-project "$SUPABASE_PROJECT_ID"
        env:
          APPLE_SIWA_KEY: ${{ secrets.APPLE_SIWA_KEY }}
          APPLE_SIWA_KEY_ID: ${{ secrets.APPLE_SIWA_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          # Scoped to the prod project: Auth Config + Project Settings, read-write.
          # Not build.yaml's SUPABASE_ACCESS_TOKEN.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_SIWA_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROD_PROJECT_ID }}
