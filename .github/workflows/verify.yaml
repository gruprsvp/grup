name: Verify

on:
  pull_request:
    # ready_for_review is NOT in the default set. Without it, a PR opened as a
    # draft (test job skipped) and then marked ready gets no new run — and a
    # skipped required check satisfies branch protection, letting untested code
    # merge. Listing types explicitly closes that bypass.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

# We only care about the latest version: stop old jobs if a new commit is pushed.
# The fallback on github.ref is for when the workflow is for a merge queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast, hermetic static checks. No Docker, no Supabase — runs on EVERY PR
  # (including drafts) so formatting/analysis protects 100% of changes cheaply.
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Download dependencies
        run: flutter pub get

      - name: Verify formatting
        # Generated code is excluded: it is formatted by its generators and is gitignored-by-convention noise here.
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' -not -name '*.g.dart' -not -name '*.freezed.dart')

      - name: Analyze
        # Fail on warnings/errors; infos stay advisory (drive them to zero over time).
        run: flutter analyze --no-fatal-infos

      - name: Generated code is up to date
        # Generated code is committed: regenerate it and fail on any change, so
        # a forgotten build_runner or gen-l10n run can't ship stale code or
        # translations.
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib

      - name: Get Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7

      - name: Edge Function tests and type check
        # Pure modules only: no Supabase, Stripe or network needed beyond the
        # packages. The type check covers every function's entry point.
        working-directory: supabase/functions
        run: |
          deno test
          deno check */index.ts

      - name: Only allowlisted files use in-framework Material
        # Since Flutter 3.47 the app uses package:material_ui. The in-framework
        # copy (package:flutter/material.dart) defines distinct types, and mixing
        # the two usually fails at runtime, not at compile time. The allowlist
        # holds legacy islands for third-party widgets still on framework
        # Material; each one needs a widget test (see test/auth_screen_test.dart).
        run: |
          allowed='lib/presentation/screens/auth.dart'
          found=$(grep -rlE "^(import|export) 'package:flutter/(material|cupertino)\.dart'" lib | grep -vxF "$allowed" || true)
          if [ -n "$found" ]; then
            echo "::error::In-framework Material/Cupertino imported outside the allowlist:"
            echo "$found"
            exit 1
          fi

  # Heavier suite: needs a local Supabase (Docker) for the repository/contract
  # tests, then builds web. Skipped only for native draft PRs to save Docker
  # spin-up on WIP; the merge queue (merge_group) always runs it, and branch
  # protection should require this check before merge.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Download dependencies
        run: flutter pub get

      - name: Setup Supabase
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # Same version as build.yaml, which runs the prod `db push`.
          version: 2.121.0

      - name: Start Supabase local for tests
        run: supabase start

      - name: Run database (pgTAP) tests
        run: supabase test db

      - name: Database security advisors
        # Supabase's linter (mutable search_path, RLS off, exposed auth.users,
        # ...). Performance findings stay advisory: the overlapping admin/self
        # policies are deliberate and pinned by pgTAP.
        run: supabase db advisors --local --type security --fail-on warn

      - name: Run tests
        run: |
          supabase status -o json > supabase/config/localhost.json
          flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Compile web
        run: flutter build web

  # Compiles Android on every PR so Gradle/AGP/Kotlin/plugin breakage shows up
  # here instead of in the production release job (build.yaml), which until now
  # was the first place Android was ever built. No Docker needed.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      # Same JDK as the release job in build.yaml.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Download dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      # R8 only runs for release builds and is where missing keep rules surface.
      # Run it without signing (no keystore on PRs): generate the release Gradle
      # config (drops dev-only plugins from the registrant), then minify only.
      - name: Release R8 minification
        run: |
          flutter build apk --release --config-only
          cd android && ./gradlew app:minifyReleaseWithR8
