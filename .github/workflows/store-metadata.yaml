name: Store metadata

# Syncs the store listings from fastlane/metadata/** — the repo is the source
# of truth for both stores. Binaries are NOT touched here (build.yaml / Xcode
# Cloud own those).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fastlane/**"
      - "Gemfile*"

# Store edits must not race each other (both jobs are per-store, so they can
# run in parallel; but two pushes must queue).
concurrency:
  group: store-metadata
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  play-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # GitHub's OIDC token, exchanged for the Play service account (keyless).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Sync Play Store listing
        run: bundle exec fastlane android sync_metadata
        env:
          SUPPLY_JSON_KEY: ${{ steps.gcp.outputs.credentials_file_path }}

  app-store:
    runs-on: ubuntu-latest
    # Screenshot uploads (and App Store processing) can take a while.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Sync App Store listing
        run: bundle exec fastlane ios sync_metadata
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
